name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Unit and fuzz tests
        run: forge test --no-match-contract Fork -vv
        working-directory: contracts
      - name: The app's redemption-queue bytecode is built from RedemptionQueue.sol
        run: node -e "const b=require('./out/RedemptionQueue.sol/RedemptionQueue.json').bytecode.object; if (b !== require('../shared/redemptionQueue.json').bytecode) { console.error('shared/redemptionQueue.json is stale'); process.exit(1) }"
        working-directory: contracts
      - name: Fork tests against the live MUSD system on Mezo testnet
        run: forge test --match-contract PayungFork --fork-url https://rpc.test.mezo.org -vv
        working-directory: contracts

  app:
    runs-on: ubuntu-latest
    # Playwright's own image: browsers and their system libraries come with it, so the job no longer
    # waits on the runner's apt mirrors (on Oct 23 2026 `install --with-deps` hung there for 30 min).
    # Keep the tag equal to @playwright/test's version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 # as Playwright's CI guide says: Firefox refuses to run as root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint app/src
      - run: npm run test:unit
      - name: End-to-end without a wallet key (read-only, plus a fresh random wallet), in Chromium, Firefox and WebKit
        run: npx playwright test -g "without a wallet"
        env:
          E2E_CHANNEL: chromium

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install slither-analyzer
      - name: Static analysis (fails on any finding)
        run: slither src/Payung.sol --config-file slither.config.json --fail-low
        working-directory: contracts
