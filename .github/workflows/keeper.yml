name: Keeper

# Scheduled every 5 minutes (GitHub starts scheduled runs best-effort). Each run watches for
# 270 s, polling every 10 s: trigger touched strikes (earning the trigger reward), pay policies,
# sample volatility. Uses a dedicated low-balance testnet key (secret KEEPER_KEY); anyone can run
# the same keeper.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w keeper
      - run: node keeper/keeper.mjs --for 270
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
          POLL_MS: 10000
