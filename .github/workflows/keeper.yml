name: Keeper

# GitHub starts scheduled runs best-effort: the */5 cron really fires every 1-3 hours. So each run
# watches for nearly the 6-hour job limit, polling every 10 s (trigger touched strikes, earning the
# trigger reward; pay policies; sample volatility; phone alerts), and the concurrency group keeps
# one scheduled run queued behind it, which starts the moment it ends: a continuous watch. Public
# repo, so the minutes are free. Uses a dedicated low-balance testnet key (secret KEEPER_KEY); anyone can run
# the same keeper.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w keeper
      - run: node keeper/keeper.mjs --for 20700
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
          POLL_MS: 10000
